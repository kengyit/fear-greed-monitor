<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="25%" stop-color="#e67e22"/>
      <stop offset="50%" stop-color="#f1c40f"/>
      <stop offset="75%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" rx="12"/>
  
  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
  </g>
  
  <!-- Gauge bar background -->
  <rect x="60" y="130" width="300" height="12" rx="6" fill="#1a1f29" opacity="0.8"/>
  
  <!-- Gauge bar fill (gradient) -->
  <rect x="60" y="130" width="300" height="12" rx="6" fill="url(#gauge)" opacity="0.7"/>
  
  <!-- Gauge needle at extreme fear position -->
  <circle cx="85" cy="136" r="8" fill="#e74c3c" filter="url(#glow)" opacity="0.9"/>
  <circle cx="85" cy="136" r="4" fill="#fff"/>
  
  <!-- Gauge labels -->
  <text x="60" y="160" font-family="monospace" font-size="9" fill="#6c7883">FEAR</text>
  <text x="330" y="160" font-family="monospace" font-size="9" fill="#6c7883" text-anchor="end">GREED</text>
  
  <!-- Emoji -->
  <text x="60" y="85" font-size="48">😱</text>
  
  <!-- Title -->
  <text x="120" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#f0f6fc">Fear &amp; Greed</text>
  <text x="120" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#f0f6fc">Monitor</text>
  
  <!-- Subtitle -->
  <text x="420" y="68" font-family="monospace" font-size="12" fill="#8b949e">Stock Market Sentiment Watchdog</text>
  <text x="420" y="86" font-family="monospace" font-size="12" fill="#8b949e">with Telegram Alerts</text>
  
  <!-- Tech badges -->
  <rect x="420" y="105" width="52" height="20" rx="4" fill="#1a3a1a"/>
  <text x="446" y="119" font-family="monospace" font-size="10" fill="#3fb950" text-anchor="middle">bash</text>
  
  <rect x="480" y="105" width="38" height="20" rx="4" fill="#1a2940"/>
  <text x="499" y="119" font-family="monospace" font-size="10" fill="#58a6ff" text-anchor="middle">jq</text>
  
  <rect x="526" y="105" width="52" height="20" rx="4" fill="#1a2940"/>
  <text x="552" y="119" font-family="monospace" font-size="10" fill="#58a6ff" text-anchor="middle">curl</text>
  
  <rect x="586" y="105" width="72" height="20" rx="4" fill="#26314a"/>
  <text x="622" y="119" font-family="monospace" font-size="10" fill="#79c0ff" text-anchor="middle">launchd</text>
  
  <rect x="666" y="105" width="72" height="20" rx="4" fill="#1a3040"/>
  <text x="702" y="119" font-family="monospace" font-size="10" fill="#26A5E4" text-anchor="middle">telegram</text>
  
  <!-- Score display -->
  <rect x="420" y="130" width="320" height="36" rx="6" fill="#1a1117" opacity="0.6"/>
  <text x="436" y="154" font-family="monospace" font-size="14" fill="#e74c3c" filter="url(#glow)">Score: 7</text>
  <text x="530" y="154" font-family="monospace" font-size="11" fill="#6c7883">│ EXTREME FEAR │ ALERT →</text>
  <text x="722" y="154" font-family="monospace" font-size="14" fill="#26A5E4">📨</text>
</svg>
